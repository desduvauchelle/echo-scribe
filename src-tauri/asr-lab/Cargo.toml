[package]
name = "tucky-asr-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Separate executable: Whisper and the app's llama.cpp must not share ggml symbols.
[dependencies]
transcribe-rs = { version = "=0.3.11", default-features = false, features = ["onnx", "whisper-cpp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { version = "=0.3.11", default-features = false, features = ["whisper-metal"] }

[profile.release]
opt-level = 3
