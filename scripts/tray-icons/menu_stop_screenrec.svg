  <rect x="18" y="18.6" width="28" height="19.6" rx="3.7" fill="none" stroke="#fff" stroke-width="4.1"/>
  <line x1="32" y1="38.2" x2="32" y2="44.6" stroke="#fff" stroke-width="4.1"/>
  <line x1="24.5" y1="46.4" x2="39.5" y2="46.4" stroke="#fff" stroke-width="4.1" stroke-linecap="round"/>
</svg>
